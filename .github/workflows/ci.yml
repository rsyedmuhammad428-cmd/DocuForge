# Runs the tests on every push and pull request.
# Written without access to GitHub Actions, so it has not been run yet. If it fails, read the log.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Tesseract lets the OCR tests run for real. Tests that need LibreOffice skip themselves without it.
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - run: npm ci
      - run: npm run engine:setup
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run engine:test
