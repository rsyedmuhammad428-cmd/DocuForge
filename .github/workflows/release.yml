# Builds the Windows installer on GitHub's Windows machines and attaches it to a release.
#
# To publish a version:   git tag v0.5.0   then   git push origin v0.5.0
# To try it without a release: Actions tab -> "Build Windows installer" -> Run workflow
#
# Written without access to GitHub Actions, so it has not been run yet. The Tesseract step is allowed to
# fail: if it does, the installer is still built, just without OCR bundled.
name: Build Windows installer

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      bundle_ocr:
        description: 'Put Tesseract (OCR, with English, Urdu and Arabic) inside the installer'
        type: boolean
        default: true

permissions:
  contents: write # needed to attach the installer to a release

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: npm ci
      - run: npm run engine:setup

      # Never build an installer from code that does not pass its tests.
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run engine:test

      - name: Put Tesseract (OCR) inside the installer
        if: ${{ github.event_name == 'push' || inputs.bundle_ocr }}
        continue-on-error: true
        shell: pwsh
        run: |
          choco install tesseract --no-progress -y
          $source = "C:\Program Files\Tesseract-OCR"
          if (-not (Test-Path "$source\tesseract.exe")) { throw "Tesseract was not installed where expected." }
          $target = "build\bundled-tools\tesseract"
          New-Item -ItemType Directory -Force $target | Out-Null
          Copy-Item "$source\*" $target -Recurse -Force
          foreach ($language in 'urd', 'ara') {
            Invoke-WebRequest "https://github.com/tesseract-ocr/tessdata_fast/raw/main/$language.traineddata" -OutFile "$target\tessdata\$language.traineddata"
          }

      # Builds the app, the packaged Python engine, the license pages, and the installer.
      - run: npm run dist

      - name: Check the packaged engine (every operation, the way the app uses it)
        run: python-engine\.venv\Scripts\python.exe python-engine\tools\smoke_packaged.py python-engine\dist\docuforge-engine\docuforge-engine.exe

      - uses: actions/upload-artifact@v4
        with:
          name: DocuForge-Setup
          path: release/DocuForge-Setup-*.exe

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: release/DocuForge-Setup-*.exe
          generate_release_notes: true
